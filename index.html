                        </div>
                        <div className="flex items-center gap-3">
                             <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" alt="Logo" className="w-10 h-10 object-contain logo-red-themed" />
                             <span className="header-logo-text text-2xl">that<span className="text-red-600">austrianone.</span></span>
                        </div>
                        
                        <div className="flex-1 flex justify-end relative" ref={menuRef}>
                            <button onClick={() => setShowLangMenu(!showLangMenu)} className="flex items-center gap-2 px-3 md:px-8 py-2 md:py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition-all text-[11px] font-black uppercase tracking-[0.2em] text-white shadow-lg">
                                <span>{t.flag}</span> <span className="hidden sm:inline">{t.name}</span> <ChevronDown size={14} className={showLangMenu ? 'rotate-180 transition-transform' : ''} />
                            </button>
                            {showLangMenu && (
                                <div className="absolute right-0 top-14 md:top-16 w-36 md:w-48 glass-modal rounded-xl md:rounded-2xl overflow-hidden shadow-2xl animate-in z-50">
                                    {Object.keys(translations).map((key) => (
                                        <button key={key} onClick={() => { setLang(key); setShowLangMenu(false); }} className={`flex items-center gap-3 w-full px-4 py-3 md:px-6 md:py-5 text-left text-[10px] md:text-[11px] font-black uppercase transition-colors hover:bg-white/5 ${lang === key ? 'text-red-500 bg-red-500/5' : 'text-zinc-400'}`}>
                                            <span>{translations[key].flag}</span> <span>{translations[key].name}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </nav>

                    <div className="relative z-10 max-w-xl mx-auto px-4 pt-32 md:pt-48 animate-in">
                        <header className="flex flex-col items-center text-center mb-10">
                            <div className="relative mb-6 group">
                                <div className="absolute -inset-2 bg-gradient-to-r from-red-600 via-rose-600 to-orange-600 opacity-20 blur-xl group-hover:opacity-50 transition duration-1000"></div>
                                <div className="absolute inset-0 bg-[conic-gradient(transparent,transparent,transparent,#dc2626,#f43f5e)] animate-rotate-slow rounded-full opacity-40"></div>
                                <div className="relative w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-[#0b0d11] overflow-hidden bg-[#161920] z-10 shadow-2xl">
                                    <img src={profile.avatar} alt="Niklas" className="w-full h-full object-cover" />
                                </div>
                            </div>
                            <h1 className="text-3xl md:text-5xl font-black italic uppercase tracking-tighter text-white drop-shadow-lg mb-2">@{profile.name}</h1>
                            <p className="text-zinc-400 text-lg font-medium italic">{t.profileDesc}</p>
                        </header>

                        {/* Main Link Highlight */}
                        <section className="mb-8">
                            <a href="https://www.craftify-mc.eu" target="_blank" 
                               className="relative group block p-0.5 rounded-[2rem] overflow-hidden transition-all duration-300 transform active:scale-[0.98] emerald-glow">
                                <div className="absolute inset-0 bg-gradient-to-r from-emerald-900 via-emerald-700 to-emerald-950 opacity-100 transition-opacity duration-500"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-[200%] bg-[conic-gradient(transparent,transparent,transparent,#10b981,#047857,#064e3b)] animate-rotate-slow opacity-100 transition-opacity duration-500"></div>
                                
                                <div className="relative bg-[#161920]/95 backdrop-blur-xl rounded-[1.9rem] p-6 sm:p-10 flex flex-col items-center justify-center text-center z-10 m-[1px]">
                                    <img src="https://raw.githubusercontent.com/der46er/craftify/main/assets/favicon.png" alt="Craftify Logo" className="w-16 h-16 sm:w-20 sm:h-20 mb-4 object-contain" />
                                    <h2 className="text-2xl sm:text-3xl font-black uppercase italic mb-1 text-white tracking-wide">
                                        {t.featureTitle}<span className="text-[#4ade80]">{t.featureHighlight}</span>
                                    </h2>
                                    <p className="text-zinc-500 text-sm sm:text-lg font-bold uppercase tracking-widest">{t.featureUrl}</p>
                                </div>
                            </a>
                        </section>

                        <main className="grid gap-3">
                            {links.map((link) => (
                                <a key={link.id} href={link.url} target="_blank" className="group flex items-center p-3 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99]">
                                    <div className={`flex-shrink-0 w-12 h-12 rounded-xl ${link.color} flex items-center justify-center shadow-lg transition-transform group-hover:scale-105`}>
                                        {link.icon}
                                    </div>
                                    <div className="ml-5 flex-grow text-left">
                                        <h3 className="text-base sm:text-lg font-black italic tracking-wide text-zinc-100 group-hover:text-white transition-colors leading-none">
                                            {link.title}
                                        </h3>
                                    </div>
                                    <div className="text-zinc-700 group-hover:text-red-500 transition-all mr-2">
                                        <ChevronRight size={22} />
                                    </div>
                                </a>
                            ))}
                            
                            {/* SPOTIFY LIVE KACHEL */}
                            <div className="group flex items-center p-3 bg-white/[0.03] border border-white/[0.05] rounded-[1.2rem] relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 text-red-500 group-hover:scale-110 transition-transform duration-500">
                                    <MusicIcon size={40} />
                                </div>
                                <div className="flex items-center gap-5 w-full text-left">
                                    <div className={`w-14 h-14 rounded-full bg-[#161920] flex items-center justify-center border-2 border-white/5 relative overflow-hidden shrink-0 shadow-xl ${spotify ? 'animate-vinyl' : ''}`}>
                                        {spotify && spotify.album_art_url ? (
                                            <>
                                                <img src={spotify.album_art_url} className="w-full h-full object-cover rounded-full" alt="Cover" />
                                                <div className="absolute w-2 h-2 bg-[#0b0d11] rounded-full border border-white/20 z-10"></div>
                                            </>
                                        ) : (
                                            <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" className="w-8 h-8 object-contain opacity-20 grayscale logo-red-themed" alt="Logo" />
                                        )}
                                    </div>
                                    <div className="text-left overflow-hidden">
                                        <p className="text-[8px] font-black text-red-500 uppercase tracking-[0.2em] mb-0.5">{spotify ? t.spotifyTitle : t.spotifyQuiet}</p>
                                        <p className="text-sm sm:text-base font-black italic uppercase text-white truncate leading-tight">
                                            {spotify ? spotify.song : "Silence"}
                                        </p>
                                        <p className="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-0.5 truncate leading-none">
                                            {spotify ? spotify.artist : "thataustrianone"}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="mt-20 text-center flex flex-col items-center gap-8">
                            <button onClick={() => setShowLegal(true)} className="flex items-center gap-2 px-8 py-3 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full text-[12px] font-black tracking-[0.3em] transition-all text-zinc-500 hover:text-white uppercase italic">
                                <Info size={16} /> {t.legal}
                            </button>
                            <div className="flex flex-col gap-1">
                                <div className="text-zinc-800 text-[10px] font-black tracking-[0.5em] uppercase opacity-40 italic leading-none">© {new Date().getFullYear()} — THAT AUSTRIAN ONE</div>
                                <div className="text-[10px] font-bold text-white/20 uppercase tracking-widest select-none">
                                    LIVE BUILD v1.2.9 | {new Date().toLocaleDateString('de-DE')}
                                </div>
                            </div>
                        </footer>
                    </div>

                    {showLegal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95 backdrop-blur-3xl animate-in text-zinc-100">
                            <div className="glass-modal rounded-[2.5rem] w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col shadow-2xl red-glow">
                                <div className="p-8 md:p-10 border-b border-white/5 flex justify-between items-center text-left">
                                    <h2 className="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-white">{t.legalTitle}</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 text-zinc-500 hover:text-white transition-all">
                                        <X size={24} />
                                    </button>
                                </div>
                                <div className="p-8 md:p-10 overflow-y-auto custom-scroll space-y-12 text-left">
                                    <section>
                                        <h3 className="text-red-600 font-black uppercase text-[9px] md:text-[10px] tracking-[0.4em] mb-4 italic">{t.legalImprint}</h3>
                                        <div className="space-y-4 font-bold uppercase">
                                            <p className="text-xl md:text-2xl font-black tracking-tight italic">Niklas Ausserwoeger</p>
                                            <p className="text-zinc-500 text-[10px] md:text-[11px] italic leading-relaxed lowercase tracking-normal">"{t.addressRequest}"</p>
                                            <p className="text-xs tracking-widest italic">4040 Linz, Österreich</p>
                                            <div className="pt-4 md:pt-6">
                                                <p className="text-zinc-600 text-[9px] md:text-[10px] mb-1 tracking-[0.3em] uppercase font-bold">{t.legalContact}</p>
                                                <p className="text-red-400 text-sm font-black italic lowercase tracking-normal">niklas.ausserwoeger@gmail.com</p>
                                            </div>
                                        </div>
                                    </section>
                                    <section className="space-y-6">
                                        <div>
                                            <h3 className="text-red-600 font-black uppercase text-[10px] tracking-[0.4em] mb-4 italic">{t.legalPrivacy}</h3>
                                            <p className="text-zinc-500 text-xs italic leading-relaxed uppercase">{t.legalPrivacyText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">{t.trademarkLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] md:text-xs italic leading-relaxed uppercase">{t.trademarkText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">{t.liabilityLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] md:text-xs italic leading-relaxed uppercase">{t.liabilityText}</p>
                                        </div>
                                    </section>
                                    <div className="pt-8 md:pt-10 border-t border-white/5 text-[9px] md:text-[10px] uppercase tracking-[0.4em] text-zinc-700 font-black text-center italic">
                                        Privatprojekt • Linz (OÖ) • {new Date().getFullYear()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
